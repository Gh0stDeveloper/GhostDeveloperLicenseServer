[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostdeveloper-license-server"
version = "0.1.0"
description = "API privada de licencias y distribución firmada para Hex Tunnel"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.48,<1",
  "SQLAlchemy>=2.0.50,<3",
  "pydantic>=2.13,<3",
  "cryptography>=46,<48",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
