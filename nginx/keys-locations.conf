# Incluir dentro del bloque server HTTPS de ghostdeveloperkeys.duckdns.org.

location = /.well-known/hextunnel-license-public.pem {
    alias /var/www/ghostdeveloper/.well-known/hextunnel-license-public.pem;
    default_type application/x-pem-file;
    add_header Cache-Control "public, max-age=3600" always;
}

# Los endpoints administrativos no se exponen a Internet.
location ^~ /api/v1/admin/ {
    return 404;
}

location = /health {
    proxy_pass http://127.0.0.1:8080;
    include proxy_params;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
}

location = /api/v1/install/authorize {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8080;
    include proxy_params;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_request_buffering on;
    client_max_body_size 32k;
}

location = /api/v1/licenses/lease {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8080;
    include proxy_params;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 32k;
}
